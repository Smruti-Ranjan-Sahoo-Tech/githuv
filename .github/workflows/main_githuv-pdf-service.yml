# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PDF service to Azure Web App - githuv-pdf-service

on:
  push:
    branches:
      - 'main'
    paths:
      - 'microservices/pdf-service/**'
      - '.github/workflows/main_githuv-pdf-service.yml'
  workflow_dispatch:

env:
  SERVICE_DIR: microservices/pdf-service
  APP_DIR: pdf-service-app
  APP_NAME: githuv-pdf-service
  SLOT_NAME: Production

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: microservices/pdf-service
        run: bun install --frozen-lockfile --production

      - name: Bundle TypeScript for the Node runtime
        working-directory: microservices/pdf-service
        run: bun build --target=node --packages=external index.ts --outdir "../../$APP_DIR/dist"

      - name: Assemble deployment package
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR/bin"
          cp "$SERVICE_DIR/bin/tectonic" "$APP_DIR/bin/tectonic"
          chmod +x "$APP_DIR/bin/tectonic"
          cp -r "$SERVICE_DIR/node_modules" "$APP_DIR/node_modules"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync(process.env.SERVICE_DIR + "/package.json", "utf8"));
            pkg.name = "githuv-pdf-service";
            pkg.main = "dist/index.js";
            pkg.scripts = { start: "node dist/index.js" };
            pkg.engines = { node: ">=20" };
            fs.writeFileSync(process.env.APP_DIR + "/package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          # Azure falls back to "node server.js" when no startup command is applied
          printf 'import "./dist/index.js";\n' > "$APP_DIR/server.js"

      - name: Warm up the Tectonic cache
        continue-on-error: true
        working-directory: pdf-service-app
        run: |
          set -euo pipefail
          mkdir -p tectonic-cache /tmp/pdf-service-prewarm
          cp ../server/src/lib/Langgraph/ResumeBuilder/Theme/Theme1.tex ./prewarm.tex
          TECTONIC_CACHE_DIR="$PWD/tectonic-cache" timeout 300 ./bin/tectonic -Z continue-on-errors \
            --outdir /tmp/pdf-service-prewarm ./prewarm.tex \
            || echo "::warning::Tectonic cache warm-up failed, the app will populate it on first request"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: pdf-service-app
          path: pdf-service-app
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: pdf-service-app
          path: pdf-service-app

      - name: Restore executable permissions
        working-directory: pdf-service-app
        run: |
          set -euo pipefail
          chmod +x bin/tectonic
          test -x bin/tectonic

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_518F3E1AB5D04FD09CB40CB3EB8F880C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_86E6345EBD2843D4976BD2A8CDFF63C8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_294CDA61D5354D69B468171D018877AF }}

      - name: Configure startup command and app settings
        uses: azure/cli@v2
        env:
          APP_NAME: ${{ env.APP_NAME }}
          SLOT_NAME: ${{ env.SLOT_NAME }}
        with:
          inlineScript: |
            set -uo pipefail
            RESOURCE_GROUP=$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup" -o tsv | head -1)
            if [ -z "$RESOURCE_GROUP" ]; then
              echo "::error::Could not resolve the resource group of ${APP_NAME}"
              exit 1
            fi
            echo "Resource group: ${RESOURCE_GROUP}"

            # try the slot first, fall back to the production slot
            slot_az() {
              local out
              if out=$(az "$@" --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" 2>&1); then
                echo "OK: az $* --slot ${SLOT_NAME}"
                return 0
              fi
              echo "::warning::az $* --slot ${SLOT_NAME} failed: ${out}"
              if out=$(az "$@" --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" 2>&1); then
                echo "OK: az $* (production slot)"
                return 0
              fi
              echo "::warning::az $* failed: ${out}"
              return 1
            }

            echo "--- current configuration ---"
            slot_az webapp config show --query "{stack:linuxFxVersion,appCommandLine:appCommandLine,alwaysOn:alwaysOn}" -o tsv || true

            echo "--- setting the startup command ---"
            slot_az webapp config set --startup-file "node dist/index.js" || true

            echo "--- setting app settings ---"
            slot_az webapp config appsettings set --settings TECTONIC_CACHE_DIR=/home/site/wwwroot/tectonic-cache LATEX_TIMEOUT_MS=120000 || true

            echo "--- configuration after ---"
            slot_az webapp config show --query "{stack:linuxFxVersion,appCommandLine:appCommandLine,alwaysOn:alwaysOn}" -o tsv || true
            slot_az webapp config appsettings list --query "[].{name:name,value:value}" -o tsv || true

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.SLOT_NAME }}
          package: pdf-service-app

      - name: Verify the deployment
        uses: azure/cli@v2
        env:
          APP_NAME: ${{ env.APP_NAME }}
          SLOT_NAME: ${{ env.SLOT_NAME }}
        with:
          inlineScript: |
            set -euo pipefail
            RESOURCE_GROUP=$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup" -o tsv | head -1)
            HOST=$(az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" --query defaultHostName -o tsv)
            echo "Waiting for ${HOST} to respond..."
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 10 "https://${HOST}/test"; then
                echo ""
                echo "PDF service is live at https://${HOST}"
                exit 0
              fi
              echo "attempt ${attempt} failed, retrying in 10s..."
              sleep 10
            done
            echo "::error::${HOST} did not become healthy in time. Check the logs with: az webapp log tail --name ${APP_NAME} --resource-group ${RESOURCE_GROUP} --slot ${SLOT_NAME}"
            exit 1
